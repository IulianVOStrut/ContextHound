version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Major @types/node updates follow the engines field and are made by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # commander 15 needs Node.js 22.12; it moves with the next major
      # release, when engines drops Node.js 20.
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
    groups:
      # Parser and plugin must stay on the same version.
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
