name: Release

# Publishes to npm with provenance when a version tag (vX.Y.Z) is pushed.
# Third-party actions are pinned by commit SHA because this job can publish.
#
# The publish job runs in the `npm-publish` environment, so it waits for a
# required reviewer after the checks pass.
#
# One-time setup:
#   - GitHub: Settings > Environments > New environment `npm-publish`. Add
#     yourself as a required reviewer and limit deployments to `v*` tags.
#   - npm trusted publishing: on npmjs.com, add this repository, the workflow
#     file `release.yml` and the environment `npm-publish` as the trusted
#     publisher for context-hound. Or, as a fallback, store a granular token
#     as the NPM_TOKEN secret of the `npm-publish` environment.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Benchmark
        run: npm run benchmark

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write   # create the GitHub Release and move the major tag
      id-token: write   # npm provenance and trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Upgrade npm (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@11

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^(## \[|---$)/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

      - name: Move major version tag (lets users pin the Action to @vN)
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
